<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>日数算出ページ</title>
    <meta name="description" content="20260927-01" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <main class="page">
      <section class="card">
        <p class="label">日数算出</p>
        <h1 class="title">日数算出ページ</h1>
        <p class="description">開始日と終了日を入力して、期間の日数を算出します！</p>

        <form id="dateForm" class="calculator" novalidate>
          <label class="field">
            <span class="fieldLabel">開始日</span>
            <input id="startDate" name="startDate" type="date" />
          </label>

          <label class="field">
            <span class="fieldLabel">終了日</span>
            <input id="endDate" name="endDate" type="date" />
          </label>

          <button id="calculateButton" class="button" type="button">算出</button>
        </form>

        <div id="message" class="message" role="alert" aria-live="polite"></div>
        <div id="result" class="result" aria-live="polite">日数を表示します。</div>
      </section>
    </main>

    <script src="../js/app.js"></script>
  </body>
</html>
